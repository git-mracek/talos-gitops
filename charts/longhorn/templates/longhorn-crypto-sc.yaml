apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-crypto
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "2880"
  fromBackup: ""
  encrypted: "true"
  cryptoSecretName: "longhorn-crypto"
  cryptoSecretNamespace: "{{ `{{pvc.namespace}}` }}"

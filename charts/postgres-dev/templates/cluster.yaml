apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-dev
  namespace: postgres-dev
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  storage:
    size: 10Gi
    storageClass: longhorn
  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "64MB"
      log_statement: "all"
      log_min_duration_statement: "0"
  bootstrap:
    initdb: {}
  managed:
    roles:
      - name: devuser
        ensure: present
        login: true
        createDb: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: postgres-dev-user-secret

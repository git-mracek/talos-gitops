# 1. Výchozí pravidlo – zahoď veškerý nevyžádaný provoz
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: postgres-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

# 2. Povol DNS
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: postgres-dev
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# 3. Povol komunikaci uvnitř namespace (inter-replica replikace)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: postgres-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}

# 4. Povol CNPG operátoru přístup k DB podům
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: postgres-dev
spec:
  podSelector:
    matchLabels:
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system

# 5. Povol příchozí TCP spojení z MetalLB/externích klientů (Tailscale)
#    Toto pokrývá provoz který přichází přes LoadBalancer service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-postgres
  namespace: postgres-dev
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres-dev
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 5432
          protocol: TCP

# 6. Povol Prometheus scraping (připraveno pro budoucí monitoring)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: postgres-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
          protocol: TCP

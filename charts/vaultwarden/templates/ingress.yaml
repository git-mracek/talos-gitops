apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: vault.mracek.dev
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: non-existing-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
  tls:
    - hosts:
        - vault.mracek.dev
      secretName: vaultwarden-tls

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-db-read-backup-secret
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["n8n-backup-s3"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-db-read-backup-secret-binding
subjects:
- kind: ServiceAccount
  name: n8n-db
roleRef:
  kind: Role
  name: allow-db-read-backup-secret
  apiGroup: rbac.authorization.k8s.io

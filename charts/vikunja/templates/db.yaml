apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vikunja-db
  namespace: vikunja
spec:
  instances: 1

  bootstrap:
    initdb:
      database: vikunja
      owner: vikunja

  managed:
    roles:
      - name: vikunja
        ensure: present
        login: true
        passwordSecret:
          name: vikunja-db-user-secret

  storage:
    storageClass: longhorn-crypto
    size: 5Gi

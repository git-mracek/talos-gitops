# =============================================================
# NetworkPolicies pro namespace: gitlab-runner
# =============================================================

# 1. Výchozí pravidlo – zahoď veškerý nevyžádaný provoz
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: gitlab-runner
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

# 2. Povol DNS
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: gitlab-runner
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# 3. Povol komunikaci ven (na GitLab.com, stažení Docker imagů a K8s API Server)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-and-k8s-api
  namespace: gitlab-runner
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

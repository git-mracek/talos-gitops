apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    host: "keycloak-db-rw"
    port: 5432
    database: "keycloak"
    usernameSecret:
      name: keycloak-db-credentials
      key: username
    passwordSecret:
      name: keycloak-db-credentials
      key: password
  hostname:
    hostname: keycloak.mracek.dev
  http:
    httpEnabled: true # TLS ukončuje ingress/reverse proxy před Keycloakem
  proxy:
    headers: xforwarded
  ingress:
    enabled: false

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Oficiální Keycloak operátor se neinstaluje jako Helm chart, ale jako sada
  # raw manifestů (2x CRD + deployment operátoru). ArgoCD je umí aplikovat
  # přímo z Git repozitáře keycloak-k8s-resources přes directory source.
  sources:
    # 1) CRD: Keycloak
    - repoURL: https://github.com/keycloak/keycloak-k8s-resources.git
      targetRevision: 26.7.2
      path: kubernetes
      directory:
        include: "keycloaks.k8s.keycloak.org-v1.yml"
    # 2) CRD: KeycloakRealmImport
    - repoURL: https://github.com/keycloak/keycloak-k8s-resources.git
      targetRevision: 26.7.2
      path: kubernetes
      directory:
        include: "keycloakrealmimports.k8s.keycloak.org-v1.yml"
    # 3) Deployment samotného operátoru
    - repoURL: https://github.com/keycloak/keycloak-k8s-resources.git
      targetRevision: 26.7.2
      path: kubernetes
      directory:
        include: "kubernetes.yml"
    # 4) CRD: KeycloakOidcClient (nová v 26.7.x)
    - repoURL: https://github.com/keycloak/keycloak-k8s-resources.git
      targetRevision: 26.7.2
      path: kubernetes
      directory:
        include: "keycloakoidcclients.k8s.keycloak.org-v1.yml"
    # 5) CRD: KeycloakSamlClient (nová v 26.7.x)
    - repoURL: https://github.com/keycloak/keycloak-k8s-resources.git
      targetRevision: 26.7.2
      path: kubernetes
      directory:
        include: "keycloaksamlclients.k8s.keycloak.org-v1.yml"
  destination:
    server: https://kubernetes.default.svc
    # Operátor sleduje namespace, ve kterém běží. Keycloak CR proto MUSÍ být
    # ve stejném namespace (keycloak).
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD jsou obří -> server-side apply (jinak hrozí "metadata.annotations: Too long")
      - ServerSideApply=true
